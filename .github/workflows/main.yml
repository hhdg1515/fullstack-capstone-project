name: CI

# DIAGNOSTIC BRANCH ONLY (claude/diag-chromium-network-change). Never merged.
# Runs one experiment on the same runner image/Chromium as browser_e2e.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network_change_diagnostic:
    name: Chromium navigation vs Docker host-network changes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm --prefix e2e ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test diag-network-change.spec.cjs --project=desktop --reporter=line
        working-directory: e2e
