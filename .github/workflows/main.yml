name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: giftlink-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: giftlink-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Verify Docker is available for isolated MongoDB tests
        run: docker info

      - name: Run backend API, identity, plan, inventory, discovery, pickups, and database preparation tests
        run: npm test

  client_build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: giftlink-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: giftlink-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend identity, account, plan, inventory, discovery, and pickup flows
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"
          TZ: America/Los_Angeles

      - name: Build frontend
        run: npm run build
        env:
          CI: "true"
          REACT_APP_BACKEND_URL: ""

      - name: Save the production build for isolated browser verification
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-build
          path: giftlink-frontend/build
          retention-days: 1

  browser_e2e:
    name: Isolated full-stack Chromium E2E
    needs: client_build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            giftlink-backend/package-lock.json
            e2e/package-lock.json
      - run: npm --prefix giftlink-backend ci
      - run: npm --prefix e2e ci
      - uses: actions/download-artifact@v4
        with:
          name: frontend-production-build
          path: giftlink-frontend/build
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:policy
        working-directory: e2e
      - run: npm test
        working-directory: e2e
