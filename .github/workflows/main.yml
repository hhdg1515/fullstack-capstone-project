name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: giftlink-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: giftlink-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Lint backend
        run: npm run lint

      - name: Verify Docker is available for isolated MongoDB tests
        run: docker info

      - name: Run backend API, identity, plan, inventory, discovery, and database preparation tests
        run: npm test

  client_build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: giftlink-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: giftlink-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend identity, account, plan, inventory, and discovery flows
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"
          TZ: America/Los_Angeles

      - name: Build frontend
        run: npm run build
        env:
          CI: "true"
          REACT_APP_BACKEND_URL: ""
